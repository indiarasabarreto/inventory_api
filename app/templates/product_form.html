<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo item | Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <img class="terreiro-logo" src="{{ url_for('static', path='logo_tuepa.png') }}" alt="Logo do terreiro">
        <div>
          <p class="eyebrow">Terreiro</p>
          <strong>Almoxarifado</strong>
        </div>
      </div>
      <a class="text-link" href="/warehouse">Voltar ao estoque</a>
    </header>

    <main class="page-shell warehouse-shell">
      <section class="form-card">
        <p class="eyebrow">Cadastro</p>
        <h1>Novo item</h1>
        <p>Cadastre o item, escolha o grupo e informe o saldo inicial contado no almoxarifado.</p>

        {% if error %}
          <p class="form-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/warehouse/products/new">
          <div class="form-grid">
            <div>
              <label for="name">Nome do item</label>
              <input id="name" name="name" type="text" value="{{ values.get('name', '') }}" placeholder="Ex.: Vela branca" required>
            </div>

            <div>
              <label for="sku">SKU ou código</label>
              <input id="sku" name="sku" type="text" value="{{ values.get('sku', '') }}" placeholder="Ex.: VEL-BRA-001" required>
            </div>

            <div>
              <label for="category_id">Categoria</label>
              <select id="category_id" name="category_id" required>
                <option value="" disabled {% if not values.get('category_id') %}selected{% endif %}>Selecione uma categoria</option>
                {% for category in categories %}
                  <option value="{{ category.id }}" {% if values.get('category_id') == category.id %}selected{% endif %}>
                    {{ category.name }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div>
              <label for="unit_price">Valor unitário aproximado</label>
              <input id="unit_price" name="unit_price" type="number" min="0.01" step="0.01" value="{{ values.get('unit_price', '') }}" required>
            </div>

            <div>
              <label for="initial_quantity">Quantidade inicial</label>
              <input id="initial_quantity" name="initial_quantity" type="number" min="0" step="1" value="{{ values.get('initial_quantity', 0) }}" required>
            </div>

            <div>
              <label for="minimum_quantity">Alerta de reposição a partir de</label>
              <input id="minimum_quantity" name="minimum_quantity" type="number" min="0" step="1" value="{{ values.get('minimum_quantity', 3) }}" required>
            </div>
          </div>

          <button type="submit">Cadastrar item</button>
        </form>
      </section>
    </main>
  </body>
</html>
