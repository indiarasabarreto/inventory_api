<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar movimentação | Almoxarifado</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <img
          class="terreiro-logo"
          src="{{ url_for('static', path='logo_tuepa.png') }}"
          alt="Logo do terreiro"
        >
        <div>
          <p class="eyebrow">Terreiro</p>
          <strong>Estoque</strong>
        </div>
      </div>
      <a class="text-link" href="/warehouse">Voltar ao estoque</a>
    </header>
    <main class="page-shell warehouse-shell">
      <section class="form-card">
        <p class="eyebrow">Movimentação</p>
        <h1>Registrar {{ "entrada" if movement_type == "in" else "saída" }}</h1>
        <p>
          {% if movement_type == "in" %}
            Informe o item e a quantidade que entrou no armário.
          {% else %}
            Informe o item e a quantidade que saiu do armário.
          {% endif %}
        </p>

        <form method="post" action="/warehouse/movement/{{ movement_type }}">
          <label for="product_id">Item</label>
          <select id="product_id" name="product_id" required>
            <option value="" selected disabled>Selecione um item</option>
            {% for product in products %}
              <option value="{{ product.id }}">
                {{ product.name }} — saldo atual: {{ product.quantity }}
              </option>
            {% endfor %}
          </select>

          <label for="quantity">Quantidade</label>
          <input id="quantity" name="quantity" type="number" min="1" step="1" required>

          <button
            class="{{ 'danger-button' if movement_type == 'out' else '' }}"
            type="submit"
          >
            Confirmar {{ "entrada" if movement_type == "in" else "saída" }}
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
